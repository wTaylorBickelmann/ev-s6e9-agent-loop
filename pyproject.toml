[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-s6e9-agent-loop"
version = "0.1.0"
description = "S6E9 competition instance of the token-thrifty Kaggle agent loop (exp0010 floor)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "kaggle>=1.6",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
nb = ["marimo>=0.13"]

[project.scripts]
kaggle-loop = "loop.cli:main"
ev-s6e9 = "ev_s6e9.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Vendored competition library is kept close to ev-purchase-kaggle a4c75ae.
# Lint the loop harness + tests; do not restyle the EV package in this instance.
[tool.ruff.lint.per-file-ignores]
"src/ev_s6e9/**" = ["E", "F", "I", "UP"]
"src/ev_s6e9/*" = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
