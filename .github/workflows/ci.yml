name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/loop tests
      - name: Tests
        run: pytest
      - name: Dry-run smoke (mock planner + executor only)
        run: python -m loop run --iterations 1 --dry-run
